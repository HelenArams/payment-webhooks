spring:
  application:
    name: payment-webhooks
  datasource:
    url: jdbc:h2:mem:webhooks;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true

webhooks:
  retry:
    # delay before retry n = backoff[n-1]; total attempts = max-attempts (first try + 8 retries)
    backoff: 10s, 30s, 2m, 10m, 30m, 1h, 2h, 4h
    max-attempts: 9
    jitter: 0.2
  dispatcher:
    enabled: true
    poll-interval: 1s
    batch-size: 50
    concurrency: 4
    timeout: 5s
    connect-timeout: 2s
    lease: 30s
    user-agent: payment-webhooks/0.1

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
